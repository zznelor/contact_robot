[project]
name = "first-contact"
version = "1.0.0"
description = "Робот первого контакта: пишет клиенту в мессенджер по новой сделке Битрикс24 через Орбиту"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "mutmut>=3",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/first_contact"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mutmut]
source_paths = ["src/first_contact/"]
# Командная строка: main() вызывается при импорте модуля, тестами не исполняется
do_not_mutate = ["src/first_contact/__main__.py"]
# Тесты подписи и кодов ошибок сверяются с копией спецификации Орбиты
also_copy = ["docs"]
# Тесты, которые ждут фоновую обработку вебхука из второго потока (TestClient), нестабильны:
# тестовый поток читает SQLite, пока поток приложения пишет (sqlite3.InterfaceError). mutmut гоняет
# набор сотни раз и падает на первом же сбое, поэтому они исключены только из мутационного прогона.
pytest_add_cli_args_test_selection = [
    "--deselect", "tests/test_app.py::test_orbita_webhook_accepted_and_processed",
    "--deselect", "tests/test_app.py::test_orbita_events_without_id_are_not_duplicates",
    "--deselect", "tests/test_app.py::test_orbita_event_failed_after_ack_processed_after_restart",
    "--deselect", "tests/test_app.py::test_orbita_redelivery_of_accepted_event_is_duplicate",
    "--deselect", "tests/test_app.py::test_client_reply_before_send_confirmation_counts",
]
